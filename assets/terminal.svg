<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Terminal: Daniel Santiago Mayorga, desarrollador backend junior. Lenguajes: Java, Python, SQL y JavaScript. Frameworks: Spring Boot, FastAPI, React y Node.js. Herramientas: PostgreSQL, MySQL, Docker, Git y n8n.">
